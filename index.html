<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교토식 화법 변환기 JP</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(135deg,#f7efe2,#e7d7c5);
color:#2b2b2b;
}

.container{
max-width:950px;
margin:auto;
padding:30px;
}

.card{
background:white;
border-radius:24px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,0.08);
}

h1{
margin-top:0;
color:#7c4d2f;
}

textarea{
width:100%;
height:170px;
padding:18px;
border:none;
border-radius:18px;
background:#faf5ef;
font-size:16px;
resize:vertical;
outline:none;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px;
}

select,button{
padding:13px;
border:none;
border-radius:14px;
font-size:15px;
}

button{
cursor:pointer;
}

.main{
background:#7c4d2f;
color:white;
}

.copy{
background:#c29a72;
color:white;
}

.random{
background:#9d7757;
color:white;
}

.translate{
background:#5e6b9c;
color:white;
}

.result{
margin-top:25px;
background:#fff8ef;
padding:22px;
border-radius:18px;
border-left:7px solid #7c4d2f;
line-height:1.8;
white-space:pre-wrap;
min-height:90px;
}

.small{
margin-top:10px;
color:#777;
font-size:14px;
}

.history{
margin-top:30px;
}

.history-item{
background:#f6f0ea;
padding:14px;
border-radius:12px;
margin-bottom:10px;
}

.footer{
margin-top:30px;
text-align:center;
color:#777;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🎐 교토식 화법 변환기 JP</h1>

<p>
입력한 말을 교토식 화법으로 바꾸고 일본어 번역까지 해줍니다.
</p>

<textarea id="inputText" placeholder="예: 너 오늘 왜 이렇게 시끄러워"></textarea>

<div class="small">
글자 수: <span id="count">0</span>
</div>

<div class="controls">

<select id="mode">
<option value="soft">부드러운 교토식</option>
<option value="dark">무서운 교토식</option>
<option value="royal">귀족풍 교토식</option>
<option value="cute">귀여운 교토식</option>
</select>

<select id="language">
<option value="none">번역 안함</option>
<option value="jp">일본어</option>
</select>

<button class="main" onclick="convertText()">변환하기</button>
<button class="copy" onclick="copyResult()">복사</button>
<button class="random" onclick="randomExample()">랜덤 예시</button>
<button class="translate" onclick="translateOnly()">번역만</button>

</div>

<div class="result" id="output">
여기에 결과가 표시됩니다.
</div>

<div class="history">
<h3>최근 기록</h3>
<div id="historyBox"></div>
</div>

<div class="footer">
교토의 미소 뒤에 숨겨진 의미를 느껴보세요.
</div>

</div>
</div>

<script>

const examples = [
"너 오늘 너무 시끄럽다",
"왜 이렇게 늦었어?",
"너 공부 못하네",
"집에 좀 가라",
"그 옷 진짜 독특하다"
];

const jpTranslations = {
"오늘은 굉장히 활기차네~":"今日はとても賑やかですね〜",
"시간에 크게 얽매이지 않는 타입이구나~":"時間にあまり縛られないタイプなんですね〜",
"앞으로 성장할 가능성이 아주 많겠네~":"これから成長する余地がたくさんありますね〜",
"벌써 늦었네, 슬슬 돌아가도 좋겠어.":"もう遅いですし、そろそろお帰りになっても良さそうですね。",
"개성이 아주 뚜렷하시네~":"とても個性的ですね〜"
};

const patterns = [
{
keywords:["시끄럽","떠들"],
soft:"오늘은 굉장히 활기차네~",
dark:"이렇게 존재감이 강할 줄은 몰랐네.",
royal:"오늘 분위기를 아주 화려하게 만드는구나.",
cute:"우와~ 정말 에너지가 넘치네!"
},
{
keywords:["늦었","지각"],
soft:"시간에 크게 얽매이지 않는 타입이구나~",
dark:"다들 기다리는 동안 여유가 있었겠네.",
royal:"등장 타이밍까지 우아하구나.",
cute:"천천히 와도 괜찮아~"
},
{
keywords:["못하","못해"],
soft:"앞으로 성장할 가능성이 아주 많겠네~",
dark:"결과보다 과정에 의미를 두는구나.",
royal:"참 독창적인 방식이네.",
cute:"조금만 더 하면 잘할 수 있어!"
},
{
keywords:["집에 가","나가"],
soft:"벌써 늦었네, 슬슬 돌아가도 좋겠어.",
dark:"이쯤이면 눈치챌 때도 된 것 같네.",
royal:"오늘은 여기까지 즐기면 좋겠구나.",
cute:"이제 슬슬 쉬러 가도 좋겠다!"
},
{
keywords:["별로","못생"],
soft:"개성이 아주 뚜렷하시네~",
dark:"쉽게 잊히진 않겠네.",
royal:"아주 인상 깊은 분위기야.",
cute:"엄청 특별한 느낌이야!"
}
];

const generic = {
soft:["참 독특한 생각이네~","아주 솔직해서 좋네~"],
dark:["굉장히 인상적이네.","오래 기억에 남겠어."],
royal:["참 우아한 발상이야.","품격 있는 의견이구나."],
cute:["귀엽게 들리네!","재미있는 생각이야~"]
};

const input = document.getElementById("inputText");
const output = document.getElementById("output");
const historyBox = document.getElementById("historyBox");

input.addEventListener("input",()=>{
document.getElementById("count").innerText=input.value.length;
});

function convertText(){

const text=input.value.trim();

if(!text){
output.innerText="먼저 문장을 입력해주세요.";
return;
}

const mode=document.getElementById("mode").value;
const lang=document.getElementById("language").value;

let result="";

for(const p of patterns){
for(const k of p.keywords){
if(text.includes(k)){
result=p[mode];
}
}
}

if(result===""){
const arr=generic[mode];
result=`"${text}"라니… ${arr[Math.floor(Math.random()*arr.length)]}`;
}

let finalResult=result;

if(lang==="jp"){
finalResult += "\n\n🌐 일본어 번역:\n" + translateJP(result);
}

output.innerText=finalResult;

saveHistory(text,finalResult);
}

function translateJP(text){

if(jpTranslations[text]){
return jpTranslations[text];
}

return "「"+text+"」";
}

function translateOnly(){

const text=input.value.trim();

if(!text){
output.innerText="번역할 문장을 입력해주세요.";
return;
}

output.innerText=translateJP(text);
}

function copyResult(){
navigator.clipboard.writeText(output.innerText);
alert("복사되었습니다!");
}

function randomExample(){
const r=examples[Math.floor(Math.random()*examples.length)];
input.value=r;
document.getElementById("count").innerText=r.length;
}

function saveHistory(input,result){

const div=document.createElement("div");
div.className="history-item";

div.innerHTML=`
<strong>입력:</strong> ${input}<br>
<strong>결과:</strong> ${result}
`;

historyBox.prepend(div);

if(historyBox.children.length>5){
historyBox.removeChild(historyBox.lastChild);
}
}

</script>

</body>
</html>
